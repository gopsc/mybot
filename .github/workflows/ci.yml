name: CI

on:
  push:
    branches: [main, gui-mybot]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint / syntax + undefined names
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install "ruff>=0.17,<1"
      - name: Ruff
        run: ruff check pymybot tests tools build_support.py
      - name: Docs/skill sync
        run: python -I tools/check_docs_skill_sync.py

  test:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Base dependency preflight
        run: python -I tools/ci_smoke.py base
      - name: Tests
        run: python -m pytest -q

  windows:
    name: pytest / Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Base dependency preflight
        run: python -I tools/ci_smoke.py base
      - name: Tests
        run: python -m pytest -q

  agent:
    name: agent / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0
      - name: Install agent, MCP and test dependencies
        run: python -m pip install -e ".[agent,mcp,web,test]"
      - name: Agent and MCP import preflight
        run: python -I tools/ci_smoke.py agent
      - name: Offline model, MCP and full regression
        run: python -m pytest -q

  wheel:
    name: wheel smoke / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build frontend
        run: python -m pip install build
      - name: Build and verify in a clean venv
        run: python -I tools/ci_smoke.py wheel

  quickstart:
    name: README quick start
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Version and diagnostics
        run: |
          python -m pymybot --version
          python -m pymybot doctor
      - name: check
        run: python -m pymybot check --robot robots/relay-test.sql --input scripts/relay-test.mt
      - name: run
        run: python -m pymybot run --robot robots/relay-test.sql --input scripts/relay-test.mt --timeout 10

  docker:
    name: docker / headless
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build headless image
        run: docker build -t pymybot:ci .
      - name: Run doctor in the image
        run: docker run --rm pymybot:ci doctor
