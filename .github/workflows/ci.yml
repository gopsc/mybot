name: CI

on:
  push:
    branches: [main, gui-mybot]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint / syntax + undefined names
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install "ruff>=0.17,<1"
      - name: Ruff
        run: ruff check pymybot tests tools build_support.py
      - name: Docs/skill sync
        run: python -I tools/check_docs_skill_sync.py
      - name: Release metadata
        run: python -I tools/check_release_metadata.py

  # One authoritative full regression with the optional MCP stack.
  test:
    name: pytest / ubuntu / mcp extra
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[mcp,test]"
      - name: MCP import preflight
        run: python -I tools/ci_smoke.py mcp
      - name: Tests
        run: python -m pytest -q

  # Base install only: proves nothing outside pyproject's base/test deps is a
  # hidden hard requirement (MCP-dependent tests skip themselves).
  base:
    name: pytest / ubuntu / base install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Base dependency preflight
        run: python -I tools/ci_smoke.py base
      - name: Tests
        run: python -m pytest -q

  windows:
    name: pytest / windows / mcp extra
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[mcp,test]"
      - name: Tests
        run: python -m pytest -q

  macos:
    name: macOS base smoke
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install base package
        run: python -m pip install -e .
      - name: Version and diagnostics
        run: |
          python -m pymybot --version
          python -m pymybot doctor
      - name: No-hardware smoke (Python driver)
        run: |
          # macOS arm64 Lupa wheels may omit LuaJIT. Use the pure-Python Time
          # driver so this job verifies the base controller without Lua FFI.
          python -m pymybot check --robot skills/hardware-controller/assets/robots/time.sql --input skills/hardware-controller/assets/scripts/time.mt
          python -m pymybot run --robot skills/hardware-controller/assets/robots/time.sql --input skills/hardware-controller/assets/scripts/time.mt --timeout 10

  wheel:
    name: wheel smoke / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build frontend
        run: python -m pip install build
      - name: Build and verify in a clean venv
        run: python -I tools/ci_smoke.py wheel

  quickstart:
    name: README quick start
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Version and diagnostics
        run: |
          python -m pymybot --version
          python -m pymybot doctor
      - name: check
        run: python -m pymybot check --robot skills/hardware-controller/assets/robots/relay-test.sql --input skills/hardware-controller/assets/scripts/relay-test.mt
      - name: run
        run: python -m pymybot run --robot skills/hardware-controller/assets/robots/relay-test.sql --input skills/hardware-controller/assets/scripts/relay-test.mt --timeout 10

  docker:
    name: docker / headless
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build headless image
        run: docker build -t pymybot:ci .
      - name: Run doctor in the image
        run: docker run --rm pymybot:ci doctor
      - name: Validate packaged assets
        run: |
          docker run --rm pymybot:ci doctor | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['healthy'], r; assert r['assets']['modules']['files'] > 0, r"
