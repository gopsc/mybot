name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without creating a release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  source:
    name: sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(python -c "import pymybot; print(pymybot.__version__)")
          cit=$(sed -n 's/^version: //p' CITATION.cff | head -1)
          test "$tag" = "$pkg" || { echo "tag $tag != pyproject $pkg"; exit 1; }
          test "$tag" = "$mod" || { echo "tag $tag != pymybot $mod"; exit 1; }
          test "$tag" = "$cit" || { echo "tag $tag != CITATION $cit"; exit 1; }
      - name: Verify release metadata
        run: python -I tools/check_release_metadata.py
      - name: Install build frontend
        run: python -m pip install build
      - name: Build
        run: python -m build --outdir dist
      - name: Verify wheel in a clean venv
        run: python -I tools/ci_smoke.py wheel
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [source]
    if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: artifacts
      - name: Flatten and checksum
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
