name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without creating a release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  source:
    name: sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(python -c "import pymybot; print(pymybot.__version__)")
          cit=$(sed -n 's/^version: //p' CITATION.cff | head -1)
          test "$tag" = "$pkg" || { echo "tag $tag != pyproject $pkg"; exit 1; }
          test "$tag" = "$mod" || { echo "tag $tag != pymybot $mod"; exit 1; }
          test "$tag" = "$cit" || { echo "tag $tag != CITATION $cit"; exit 1; }
      - name: Install build frontend
        run: python -m pip install build
      - name: Build
        run: python -m build --outdir dist
      - name: Verify wheel in a clean venv
        run: python -I tools/ci_smoke.py wheel
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows GUI bundle
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install agent, camera, web and packaging dependencies
        run: python -m pip install -e ".[agent,camera,package,web]"
      - name: Doctor
        run: python -m pymybot doctor
      - name: Build bundle
        run: python -m PyInstaller --noconfirm --clean tools/mybot.spec
      - name: Smoke the bundle
        run: |
          dist\mybot\pymybot.exe --version
          dist\mybot\pymybot.exe doctor
          dist\mybot\pymybot.exe check --robot dist\mybot\robots\relay-test.sql --input dist\mybot\scripts\relay-test.mt
      - name: Verify camera support in the bundle
        shell: pwsh
        run: |
          $doctor = & dist\mybot\pymybot.exe doctor | ConvertFrom-Json
          $av = $doctor.checks | Where-Object { $_.name -eq "av" }
          if ($null -eq $av -or $av.status -ne "ok") {
            throw "PyAV is not importable in the Windows bundle (status: $($av.status))"
          }
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not $version) { $version = "dev" }
          $name = "pymybot-$version-windows-x64"
          Compress-Archive -Path dist/mybot -DestinationPath "dist/$name.zip"
          Get-FileHash "dist/$name.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $name.zip" } |
            Out-File "dist/SHA256SUMS" -Encoding ascii
          Get-Content "dist/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [source, windows]
    if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: artifacts
      - name: Flatten and checksum
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
