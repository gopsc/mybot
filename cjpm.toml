
[package]
  cjc-version = "1.1.3"
  name = "bot4cj"
  description = "基于仓颉和 Linux I2C 接口的机器人硬件脚本解析器"
  version = "0.0.3"
  target-dir = ""
  src-dir = ""
  output-type = "executable"
  compile-option = "-l c -l pthread -l lua" # Linux
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]
  #ctype4cj = { git = "https://gitcode.com/qingss0/ctype4cj.git", branch="main" }
  ctype4cj = "1.0.3"
  #pthread4cj = { git = "https://gitcode.com/qingss0/pthread4cj.git", branch="main"}
  pthread4cj = "1.0.0"
  #spi4cj = { git = "https://gitcode.com/qingss0/spi4cj.git", branch="main"}
  spi4cj = "1.0.0"
  #lua4cj = { git = "https://gitcode.com/qingss0/lua4cj.git", branch="main" }
  lua4cj = "1.0.0"
  nn4cj = { git = "https://gitcode.com/qingss0/nn4cj.git", branch="main"}
# 这种x86机器人开发板感觉不经常使用，我没用过，不知道里面的i2c调用是不是参数是一样的
[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.dependencies]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}/linux_x86_64_cjnative/static/stdx"]

[target.aarch64-unknown-linux-gnu]
  [target.aarch64-unknown-linux-gnu.dependencies]
  [target.aarch64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}/linux_aarch64_cjnative/static/stdx"]
    
# 为什么不支持Windows了？
# 因为新版我们加载了Linux的glibc，通常Windows中没有这个
#[target.x86_64-w64-mingw32]
#  [target.x86_64-w64-mingw32.bin-dependencies]
#    path-option = ["${CANGJIE_STDX_PATH}\\windows_x86_64_cjnative\\dynamic\\stdx"]
