<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="ahA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="ahG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="ahP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="940" fill="#f8fafc"/>
  <!-- 快照日期标注（2026-10-04 冻结）：本图随 architecture_analysis.html 一并冻结，
       描述 2026-09-25 的形态，不含 sim/ 迁入、多机器人、~/.mybot 持久化、领域门面拆分。
       重绘需同步改 analysis 页正文，故不单独更新——权威口径见 docs/ 下各 md。 -->
  <text x="20" y="26" font-size="12" fill="#94a3b8">2026-09-25 快照（已冻结）· 权威口径见 docs/</text>
  <text x="750" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">bot4cj.cpp 机器人控制框架 · 架构全景图</text>
  <text x="750" y="64" text-anchor="middle" font-size="14" fill="#64748b">C++17 宿主（std::thread + LuaJIT C API，mybot --mcp-backend 工具后端）+ Rust agent 进程（mybot-agent，模型循环）+ Lua 驱动层 + Linux HAL · 结构(.sql) / 驱动(.lua) / 动作(.mt) 三脚本分治</text>

  <!-- ===== L7 输入层 ===== -->
  <g>
    <rect x="40" y="84" width="1420" height="118" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="60" y="112" font-size="16" font-weight="700" fill="#3730a3">L7 · 输入 / 编排层（声明式）</text>
    <g>
      <rect x="80" y="128" width="300" height="58" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="230" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#312e81">.sql 结构脚本</text>
      <text x="230" y="172" text-anchor="middle" font-size="12" fill="#64748b">CREATE TABLE / INSERT（sqlparse 解析）</text>
    </g>
    <g>
      <rect x="420" y="128" width="300" height="58" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="570" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#312e81">.mt 动作脚本</text>
      <text x="570" y="172" text-anchor="middle" font-size="12" fill="#64748b">mt2 行列 DSL · 一帧 = 一行（@Include 归并）</text>
    </g>
    <g>
      <rect x="760" y="128" width="300" height="58" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="910" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#312e81">动作输入源三选一</text>
      <text x="910" y="172" text-anchor="middle" font-size="12" fill="#64748b">actionsource.cpp：TCP 单连接 / 文件 / stdin 管道</text>
    </g>
    <g>
      <rect x="1100" y="128" width="320" height="58" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="7 4"/>
      <text x="1260" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#6d28d9">mybot-agent（Rust 独立进程）</text>
      <text x="1260" y="172" text-anchor="middle" font-size="12" fill="#64748b">REPL / --task / --prompt-file · rig 0.42 直连 provider</text>
    </g>
  </g>

  <!-- ===== C++17 宿主核心层 ===== -->
  <g>
    <rect x="40" y="222" width="1420" height="250" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="60" y="250" font-size="16" font-weight="700" fill="#1e3a8a">C++17 宿主层（src/）—— 解析 · 装配 · 播放</text>

    <!-- main.cpp -->
    <g>
      <rect x="80" y="268" width="256" height="180" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="208" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">main.cpp</text>
      <text x="208" y="320" text-anchor="middle" font-size="12.5" fill="#475569">cliargs.cpp 解析/校验/帮助</text>
      <text x="208" y="342" text-anchor="middle" font-size="12.5" fill="#475569">信号处理仅置 atomic 标志</text>
      <text x="208" y="364" text-anchor="middle" font-size="12.5" fill="#475569">runActionPipeline 动作管线</text>
      <text x="208" y="386" text-anchor="middle" font-size="12.5" fill="#475569">--mcp-backend 工具后端管线</text>
      <text x="208" y="412" text-anchor="middle" font-size="11.5" fill="#0ea5e9">activate → run → deactivate</text>
    </g>

    <!-- robot.cpp -->
    <g>
      <rect x="352" y="268" width="256" height="180" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="480" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">robot.cpp · RobotStruct</text>
      <text x="480" y="320" text-anchor="middle" font-size="12.5" fill="#475569">装配流程 + 生命周期编排</text>
      <text x="480" y="342" text-anchor="middle" font-size="12.5" fill="#475569">（五类已拆四个编译单元）</text>
      <text x="480" y="364" text-anchor="middle" font-size="12.5" fill="#475569">hw_registry / meta_provider</text>
      <text x="480" y="386" text-anchor="middle" font-size="12.5" fill="#475569">hw_factory / action_runner</text>
      <text x="480" y="412" text-anchor="middle" font-size="11.5" fill="#0ea5e9">编排门面 · 逆序 deactivate</text>
    </g>

    <!-- 解析层 -->
    <g>
      <rect x="624" y="268" width="256" height="180" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="752" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">解析层</text>
      <text x="752" y="320" text-anchor="middle" font-size="12.5" fill="#475569">sqlparse.cpp SQL 词法语法</text>
      <text x="752" y="342" text-anchor="middle" font-size="12.5" fill="#475569">matrix.cpp 矩阵/mt2 对象</text>
      <text x="752" y="364" text-anchor="middle" font-size="12.5" fill="#475569">expr.cpp $(...) 求值器（pimpl）</text>
      <text x="752" y="386" text-anchor="middle" font-size="12.5" fill="#475569">括号/运算符/嵌套多级双限</text>
      <text x="752" y="412" text-anchor="middle" font-size="11.5" fill="#0ea5e9">mtinclude.cpp @Include 归并</text>
    </g>

    <!-- 硬件变量 -->
    <g>
      <rect x="896" y="268" width="256" height="180" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="1024" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">硬件变量类</text>
      <text x="1024" y="320" text-anchor="middle" font-size="12.5" fill="#475569">hardware.hpp 基类接口</text>
      <text x="1024" y="342" text-anchor="middle" font-size="12.5" fill="#475569">play / read / build / destroy</text>
      <text x="1024" y="364" text-anchor="middle" font-size="12.5" fill="#475569">luavar.cpp Lua 驱动变量</text>
      <text x="1024" y="386" text-anchor="middle" font-size="12.5" fill="#475569">daemonvar.cpp @Daemon 变量</text>
      <text x="1024" y="412" text-anchor="middle" font-size="11.5" fill="#475569">唯一所有权：unique_ptr 独占</text>
    </g>

    <!-- MCP 工具后端 -->
    <g>
      <rect x="1168" y="268" width="256" height="180" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="1296" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">MCP 工具后端</text>
      <text x="1296" y="320" text-anchor="middle" font-size="12.5" fill="#475569">mcpbackend AF_UNIX 帧协议</text>
      <text x="1296" y="342" text-anchor="middle" font-size="12.5" fill="#475569">socket 占用探测防双实例</text>
      <text x="1296" y="364" text-anchor="middle" font-size="12.5" fill="#475569">agenttools 8 工具（3 需显式开启）</text>
      <text x="1296" y="386" text-anchor="middle" font-size="12.5" fill="#475569">agentview/agentimage 视图与图像</text>
      <text x="1296" y="412" text-anchor="middle" font-size="11.5" fill="#0ea5e9">agentpolicy/agentaudit 策略与审计</text>
    </g>
  </g>

  <!-- ===== L5 Lua 状态机 ===== -->
  <g>
    <rect x="40" y="492" width="1420" height="150" rx="10" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="60" y="520" font-size="16" font-weight="700" fill="#065f46">L5 · LuaJIT 状态机（独立 lua_State · 驱动运行期）</text>
    <text x="60" y="548" font-size="13" fill="#475569">每个硬件变量一个独立 Lua 状态机（<tspan font-weight="600" fill="#065f46">luabridge.cpp</tspan> 调用 · <tspan font-weight="600" fill="#065f46">luasandbox.cpp</tspan> 沙箱：os/io 中和、dofile/loadfile 白名单到 BOT4CJ_MODULE_PATH）；驱动返回 {result="OK"/"ERR", message}（ERR 契约）</text>
    <g>
      <rect x="80" y="562" width="200" height="60" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.3"/>
      <text x="180" y="588" text-anchor="middle" font-size="13.5" font-weight="600" fill="#065f46">build(data)</text>
      <text x="180" y="608" text-anchor="middle" font-size="11.5" fill="#64748b">配置 / 器件甄别</text>
    </g>
    <g>
      <rect x="300" y="562" width="200" height="60" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.3"/>
      <text x="400" y="588" text-anchor="middle" font-size="13.5" font-weight="600" fill="#065f46">call(data)</text>
      <text x="400" y="608" text-anchor="middle" font-size="11.5" fill="#64748b">读 / 写 / 采样</text>
    </g>
    <g>
      <rect x="520" y="562" width="200" height="60" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.3"/>
      <text x="620" y="588" text-anchor="middle" font-size="13.5" font-weight="600" fill="#065f46">destroy(data)</text>
      <text x="620" y="608" text-anchor="middle" font-size="11.5" fill="#64748b">复位 / 关 fd / 省电</text>
    </g>
    <g>
      <rect x="740" y="562" width="320" height="60" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.3"/>
      <text x="900" y="588" text-anchor="middle" font-size="13.5" font-weight="600" fill="#065f46">read(data)</text>
      <text x="900" y="608" text-anchor="middle" font-size="11.5" fill="#64748b">无副作用读（引用快照 / 滤波器）</text>
    </g>
    <g>
      <rect x="1080" y="562" width="340" height="60" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.3"/>
      <text x="1250" y="588" text-anchor="middle" font-size="13.5" font-weight="600" fill="#065f46">controller 转发</text>
      <text x="1250" y="608" text-anchor="middle" font-size="11.5" fill="#64748b">先跑自己 Lua，再转发 {元数据 ∪ 返回表} 给下游</text>
    </g>
  </g>

  <!-- ===== L4 驱动 + 库 ===== -->
  <g>
    <rect x="40" y="662" width="1420" height="130" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="60" y="690" font-size="16" font-weight="700" fill="#9a3412">L4 · 驱动 + 库层（LuaJIT · modules/）—— 58 模块 = 48 器件/执行器/系统接口 + 3 总线 + 7 框架/工具，另 20 个 lib/ 共享库</text>
    <text x="60" y="716" font-size="13" fill="#475569"><tspan font-weight="600" fill="#9a3412">驱动（按总线/能力）：</tspan>I2C 传感（MPU6050/BME280/VL53L0X/AS7262/SGP30/MAX30102…）· SPI（ADS1256/MT6826S…）· UART（MHZ19/SDS011/SCSCL…）· 执行器（PCA9685/Servo/PWM/AD9833）· 电源（INA219/INA3221/LTC2944/MAX17043）· Camera（V4L2 + MJPEG）· Speaker（ALSA 音频输出）· 框架（I2C/SPI/UART/Relay/Monitor/dummy）</text>
    <text x="60" y="742" font-size="13" fill="#475569"><tspan font-weight="600" fill="#9a3412">公共库（modules/lib/）：</tspan>HAL.lua（总线函数单点 · 按 BOT4CJ_HAL_BACKEND 选后端）· hal_backend_glibc.lua（ffi 直调 glibc 的后端实现）· drv_common.lua（arg_table/ERR 契约）· bus_contract.lua（总线契约单点）· virtbus.lua（虚拟总线桩替身）· sensor_daemon.lua（万能采样 chunk）· mpath.lua · ema/kalman/nn.lua · asound.lua（ALSA ffi）· mjpeg_frame.lua · utf8.lua · daemon_tid/probe.lua（注：bitcompat.lua 在 modules/ 顶层，不在 lib/）</text>
    <text x="60" y="768" font-size="12" fill="#64748b">传感器桩替身与 Relay 转发链路使「不接硬件也能跑通全流程」；virtbus 可在无真机时验证任意驱动 build/call/destroy 链路（故障注入：NACK / fd 泄漏计数）</text>
  </g>

  <!-- ===== L1-L3 基座 ===== -->
  <g>
    <rect x="40" y="812" width="1420" height="98" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="60" y="840" font-size="16" font-weight="700" fill="#991b1b">L1–L3 · 系统基座（Linux）</text>
    <g>
      <rect x="80" y="854" width="360" height="48" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.3"/>
      <text x="260" y="874" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">glibc · ffi.C 直调 + LuaJIT C API + std::thread</text>
      <text x="260" y="892" text-anchor="middle" font-size="11.5" fill="#64748b">open / ioctl / read / write / close / usleep · 零第三方 C++ 依赖</text>
    </g>
    <g>
      <rect x="470" y="854" width="470" height="48" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.3"/>
      <text x="705" y="874" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Linux 设备文件</text>
      <text x="705" y="892" text-anchor="middle" font-size="11.5" fill="#64748b">/dev/i2c-* · /dev/spidev* · /dev/tty* · /sys/class/pwm · /dev/gpio*（gpiod）</text>
    </g>
    <g>
      <rect x="970" y="854" width="350" height="48" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.3"/>
      <text x="1145" y="874" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">内核驱动</text>
      <text x="1145" y="892" text-anchor="middle" font-size="11.5" fill="#64748b">I2C / SPI / UART / PWM / GPIO 子系统（I2C_RDWR 原子事务）</text>
    </g>
  </g>

  <!-- ===== 主数据流箭头（右侧竖向主干）===== -->
  <g stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#ahA)">
    <path d="M1470 200 L1470 492"/>
  </g>
  <!-- mybot-agent → MCP 工具后端（AF_UNIX socket） -->
  <g stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 4" fill="none" marker-end="url(#ahP)">
    <path d="M1260 186 L1260 262"/>
  </g>
  <text x="1250" y="240" text-anchor="end" font-size="11.5" fill="#7c3aed" font-weight="600">AF_UNIX socket（MCP 帧协议）</text>
  <g stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#ahG)">
    <path d="M1470 642 L1470 812"/>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M1470 662 L1470 492"/>
  </g>
  <text x="1485" y="360" font-size="12.5" fill="#2563eb" font-weight="600" transform="rotate(90 1485 360)">.sql/.mt 解析</text>
  <text x="1485" y="600" font-size="12.5" fill="#16a34a" font-weight="600" transform="rotate(90 1485 600)">build/call/destroy</text>
  <text x="1485" y="760" font-size="12.5" fill="#475569" font-weight="600" transform="rotate(90 1485 760)">ffi.C → 内核</text>

  <!-- 跨层引用（daemon_slot 回读） -->
  <g stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#ah)">
    <path d="M960 300 C 1120 300 1240 300 1340 348"/>
  </g>
  <text x="1030" y="288" font-size="11.5" fill="#b45309" font-weight="600">@Daemon 守护线程 std::thread + 独立 lua_State（336B 共享槽 static_assert 钉布局）→ 主线程 play() 加锁读槽</text>

  <!-- 底部说明 -->
  <text x="750" y="928" text-anchor="middle" font-size="12" fill="#94a3b8">数据主干：.sql 定义硬件拓扑 → RobotStruct 建变量表 → .mt 逐行驱动 hv.play → Lua call → HAL 基元 → 内核设备文件；@Daemon 经共享内存槽做跨线程 IPC，controller 与 $ 引用列把「传感器 → 滤波 → 执行器」串成引用链；模型循环在独立 Rust 进程 mybot-agent（rig 直连 provider），经 AF_UNIX socket 调用 C++ 宿主的 MCP 工具后端</text>
</svg>
