# pymybot CI：pytest 全量回归 + README 快速开始自检。
#
# GitCode 属 GitLab 系托管，经 .gitlab-ci.yml 驱动（与 main 分支同一约定）；若托管方
# 不识别本文件则静默不生效（无副作用），迁移其它平台时按同结构翻译即可。
#
# 与 main 分支的差异如实声明：本分支没有 C++ 构建产物、也没有 test/run_all.sh 守门，
# 因此不设 build 阶段，守门就是 pytest 本身。
#
# 版本矩阵的判据：
# - 3.11 是 pyproject 里 requires-python 的下界，3.13 是当前最新，3.12 取中。
#   任一版本红 ⇒ `requires-python = ">=3.11"` 的声明与实际不符。
# - lupa（LuaJIT）、pillow 均有 manylinux wheel，pyftdi/pyserial 为纯
#   Python，故 python:slim 镜像即可，不需要 gcc / luajit-dev，job 时长可控。
#   摄像头采集依赖 av（`.[camera]` 可选）不在 CI 安装，测试用假模块覆盖。
#
# Windows 未纳入矩阵：托管方默认不提供 Windows runner。`tests/conftest.py` 的
# `usable_symlink()` 已把「平台表达不了软链」的情况收敛成 skip，因此 Windows 自建
# runner 接入时矩阵可直接追加一条，不需要改测试。

stages:
  - test

.pytest:
  stage: test
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[test]"
    - python -m pytest -q

test:py3.11:
  extends: .pytest
  image: python:3.11-slim

test:py3.12:
  extends: .pytest
  image: python:3.12-slim

test:py3.13:
  extends: .pytest
  image: python:3.13-slim

# README「快速开始」的两条命令：文档里的承诺由 CI 验证，而不是靠人工记得跑。
# 这两条命令不激活驱动、只走 Timer/Relay 纯软件模块，可在无硬件环境执行。
smoke:quickstart:
  stage: test
  image: python:3.13-slim
  script:
    - python -m pip install -e ".[test]"
    - python -m pymybot check --robot robots/relay-test.sql --input scripts/relay-test.mt
    - python -m pymybot run --robot robots/relay-test.sql --input scripts/relay-test.mt --timeout 10
