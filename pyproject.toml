[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pymybot"
version = "0.1.0"
description = "Cross-platform Python robot controller with Lupa Lua drivers and sqlparse"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "lupa>=2.6,<3",
  "sqlparse>=0.5.3,<0.6",
  "pyserial>=3.5,<4",
  "pyftdi>=0.55,<1",
  "pillow>=11,<14",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
camera = ["av>=19,<20"]
agent = [
  "pydantic-ai-slim[openai,anthropic]==2.57.0",
  "anthropic>=1.12.1,<2", # 2.x replaces the constructible BetaMessageParam expected by PydanticAI 2.57.
]
linux = ["smbus2>=0.5; sys_platform == 'linux'", "spidev>=3.6; sys_platform == 'linux'"]

[project.scripts]
pymybot = "pymybot.cli:main"
mybot-gui = "pymybot.gui.__main__:main"

[tool.setuptools]
packages = ["pymybot", "pymybot.gui"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
