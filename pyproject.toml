[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pymybot"
version = "0.4.0"
description = "Cross-platform robot controller with LuaJIT drivers, SQL structures and an approval-gated AI agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "pymybot contributors" }]
keywords = ["robotics", "hardware", "luajit", "sql", "ai-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Embedded Systems",
  "Typing :: Typed",
]
dependencies = [
  "lupa>=2.8,<3",
  "sqlparse>=0.6,<0.7",
  "pyserial>=3.5,<4",
  "pyftdi>=0.57.2,<1",
  "pillow>=13,<14",
  "smbus2>=0.5,<1; sys_platform == 'linux'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.10,<7"]
test = ["pytest>=9.1.1,<10", "ruff>=0.17,<1", "PySide6>=6.10,<7"]
camera = ["av>=19.0.2,<20"]
web = ["httpx>=0.28,<1", "beautifulsoup4>=4.12,<5"]
# MCP 2 renamed the low-level Server API; the server targets the 1.x contract.
mcp = ["mcp>=1.30,<2"]
agent = [
  "pydantic-ai-slim[openai,anthropic,mcp]>=2.61,<3",
  "anthropic>=2.3,<3",
  "mcp>=1.30,<2",
]
# spidev publishes source-first releases for most Linux/Python combinations, so it
# stays opt-in; smbus2 is pure Python and ships as a base Linux dependency.
linux = ["spidev>=3.6,<4; sys_platform == 'linux'"]
package = ["pyinstaller>=6.22,<7", "PySide6>=6.10,<7"]

[project.urls]
Homepage = "https://github.com/gopsc/mybot"
Documentation = "https://github.com/gopsc/mybot/tree/gui-mybot/docs"
Changelog = "https://github.com/gopsc/mybot/blob/gui-mybot/CHANGELOG.md"
Issues = "https://github.com/gopsc/mybot/issues"
Security = "https://github.com/gopsc/mybot/security/advisories/new"

[project.scripts]
pymybot = "pymybot.cli:main"
mybot-gui = "pymybot.gui.__main__:main"

[tool.setuptools]
packages = ["pymybot", "pymybot.gui"]

[tool.setuptools.package-data]
pymybot = ["py.typed", "gui/assets/*.svg"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Narrow, meaningful gate: syntax errors and undefined names only. The
# repository predates a full formatter baseline; style churn belongs in its own PR.
select = ["E9", "F63", "F7", "F82"]
