
[package]
  cjc-version = "1.1.3"
  name = "bot4cj"
  description = "基于仓颉和 Linux I2C 接口的机器人硬件控制器（用 DSL 描述机器人结构与动作）"
  version = "0.3.3"
  target-dir = ""
  src-dir = ""
  output-type = "executable"
  compile-option = "-lc -lluajit-5.1" # Linux；pthread 链接经绑定包动态库传递；luajit 因 Lua.cj 直接引用 lua_rawseti/lua_pushvalue（H-03）需显式链接
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]
  #pthread4cj = { git = "https://gitcode.com/qingss0/pthread4cj.git", branch="main" }

  ctype4cj = "1.0.4"
  mt2 = "1.0.0"
  luajit4cj = "1.0.1"
  pthread4cj = "1.0.2"
  SQL4cj = "1.0.3"

# 这种x86机器人开发板感觉不经常使用，我没用过，不知道里面的i2c调用是不是参数是一样的
[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.dependencies]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}/linux_x86_64_cjnative/static/stdx"]

[target.aarch64-unknown-linux-gnu]
  [target.aarch64-unknown-linux-gnu.dependencies]
  [target.aarch64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}/linux_aarch64_cjnative/static/stdx"]
    
# 为什么不支持Windows了？
# 因为新版我们加载了Linux的glibc，通常Windows中没有这个
#[target.x86_64-w64-mingw32]
#  [target.x86_64-w64-mingw32.bin-dependencies]
#    path-option = ["${CANGJIE_STDX_PATH}\\windows_x86_64_cjnative\\dynamic\\stdx"]
