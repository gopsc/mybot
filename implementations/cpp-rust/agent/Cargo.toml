[package]
name = "mybot-agent"
version = "0.1.0"
edition = "2021"
description = "bot4cj Rust agent: rig 驱动的完整 agent，经 AF_UNIX 帧通道调用 mybot --mcp-backend 工具层"
license = "MIT"

# rig agent（2026-09-24 迁移，批次 B）：取代 C++ agent loop 与 MCP sidecar。
# 对上直接面对用户（REPL / --task），对下说后端的 pymsg 兼容帧（AF_UNIX）。
# 语义→落点矩阵见批次 B/C 的迁移提交（git log -- agent/；核对基准 rig 0.42 源码）。
# C++ 侧判据以 docs/agent.md 为准，Rust 侧逐字对齐。

[[bin]]
name = "mybot-agent"
path = "src/main.rs"

[dependencies]
# 钉精确版本：API 面按 0.42.0 源码核对（/tmp/rigsrc/{rig-core,rig-agent}-0.42.0，
# 沿用 rmcp 2.2.0 的源码核对惯例）。rig-agent 缺省 feature 仅 derive（不拉 rmcp）；
# rig-core 缺省 reqwest + derive + rustls（providers 无 feature 门，全编）。
# ⚠ 升级提醒（2026-09-25 R12 回归）：0.42.0 的 DeepSeek 响应解析误要求 tool.index
#   与非 null content（真网关允许纯工具轮 content=null）。本仓以 provider.rs 的
#   DeepSeekChat 自定义 provider 绕行（沿用其请求整形、换标准 OpenAI 解析器）。
#   升级 rig 时先核对该缺陷是否已在上游修复；修复后应删掉这层绕行回归
#   deepseek::Client::completion_model（编译期强绑 trait，升级会先红后删）。
rig-core = { version = "=0.42.0" }
rig-agent = { version = "=0.42.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
# futures：流式面要自己实现 Stream 适配器（首帧预取重试、帧间空闲超时、审计落行），
# rig 只重导出 Stream 类型别名不重导出 StreamExt/stream::once（已在 rig 依赖树里，不新增下载）。
futures = "0.3"
# libc：审计时间戳要**本地时间 + UTC 偏移**（localtime_r 与 C++ auditTimestamp 逐字段
# 同构）；纯 std 拿不到本机时区偏移，自己解析 /etc/localtime 是重造轮子。
# 另外：信号处置的强杀路径（SIG_DFL + raise）与 C++ onStopSignal 同款。
libc = "0.2"
# rustyline：交互 REPL 的行编辑 / ↑↓ 历史 / `/命令` Tab 补全（2026-09-25）。只在
# stdin+stdout 都是终端时启用（linein.rs），管道面仍是裸逐行读。关掉缺省 feature：
# 不要 custom-bindings（radix_trie）与 with-dirs（home）——历史路径本仓自己按 XDG 解析。
rustyline = { version = "18", default-features = false, features = ["with-file-history"] }
# reqwest / url：http_fetch 本地工具（Phase 6）。两者已是 rig-core 的传递依赖（Cargo.lock
# 已解析），这里钉同一版本并关缺省 feature，不新增下载、不引入 native-tls/openssl。
# ⚠ rig-core 打开了 reqwest/system-proxy，feature 合并后本仓 client 也会读 HTTP(S)_PROXY——
#   httpfetch.rs 构造时显式 no_proxy()，出站白名单之外不允许再经过第三方。
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
url = "2"
# base64：录制模式（--record）把上下文里的 data URL 图片解码成二进制文件落盘。
# 已是 rig-core 的传递依赖（Cargo.lock 已解析 0.22.1），钉同版本不新增下载。
base64 = "0.22"

[dev-dependencies]
# 单测要构造 429/5xx 的 provider 响应错误（rig 的 provider_response_status() 给的是
# http::StatusCode，而 rig-core 只转发 HeaderMap 等，不转发 StatusCode）。
http = "1"

[profile.release]
opt-level = 2
lto = "thin"
